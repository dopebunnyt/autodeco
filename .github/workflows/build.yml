name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          sdk: v5.11.2
          target: Win64
      - name: Upload the mod file
        uses: actions/upload-artifact@v4
        with:
          name: Auto Deco Mod
          path: "**/*.geode"
          if-no-files-found: error
